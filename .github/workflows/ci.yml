# AI-assisted: written with Claude Code (Anthropic) for the NASA Space Apps 2026 entry; reviewed by the team.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Synthetic data is reproducible (seeded)
        run: |
          python data/generate.py data/crew_cases.json
          git diff --exit-code -- data/crew_cases.json site/cases.json
      - name: Unit tests (NASA rules, JS parity, v3 engine acceptance suite; offline, no key)
        run: python -m unittest discover -s tests -v
      - name: AI-use mark on every code and data file
        run: python scripts/check_ai_mark.py
      - name: v3 engine acceptance suite (node --test)
        run: node --test tests/v3/*.test.mjs
      - name: No private workspace links in tracked files
        if: always()
        run: |
          set +e
          git grep -nIE 'drive\.google\.com|docs\.google\.com|drive\.usercontent\.google|notion\.(so|site|com)' -- . ':!.github/workflows/ci.yml'
          rc=$?
          set -e
          # git grep: 0 = match found, 1 = no match, anything else = error. Only "no match" passes.
          if [ "$rc" -ne 1 ]; then
            echo "Private workspace link found, or git grep failed (rc=$rc)"
            exit 1
          fi
      # Scans the commits of this push or PR. The whole history is scanned locally by the
      # hackathon prepublish scan before the repo goes public.
      - name: Secret scan (gitleaks)
        if: always()
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
