# AI-assisted: written with Claude Code (Anthropic) for the NASA Space Apps 2026 entry; reviewed by the team.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (offline, no key)
        run: python -m unittest discover -s tests -v
      - name: AI-use mark on every code and data file
        run: python scripts/check_ai_mark.py
      - name: No private workspace links in tracked files
        run: |
          if git grep -nIE 'drive\.google\.com|docs\.google\.com|notion\.so|notion\.site' -- . ':!.github/workflows/ci.yml'; then
            echo "Private workspace link found in a tracked file"
            exit 1
          fi
      - name: Secret scan (whole history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
